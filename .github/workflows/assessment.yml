name: QA assessment checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - name: Run API validation tests
        run: npm run test:api
      - name: Start app for UI scenarios
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/emi-next.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > /tmp/emi-next.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/emi-next.log
          exit 1
      - name: Run Cucumber UI scenarios
        run: npm run test:ui
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assessment-test-reports
          path: |
            artifacts/api-report/
            artifacts/ui-report.html
          if-no-files-found: ignore
